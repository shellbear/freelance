name: daily-stats

on:
  schedule:
    # Off the hour: GitHub warns that the start of each hour is the busiest.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write # commit data.json
  actions: write # keep this workflow enabled

concurrency:
  group: daily-stats

env:
  OFFERS: freelance-offers/offers.parquet

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: v2
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run verify

      - name: Download private offers
        run: |
          mkdir -p .data
          bunx wrangler@4 r2 object get "$OFFERS" --remote --file .data/offers.parquet

      # Fails on any missing page, so nothing is published. The next run re-reads 7 days.
      - name: Fetch new offers
        run: bun run fetch

      - name: Build
        run: bun run build

      - name: Upload private offers
        run: |
          bunx wrangler@4 r2 object put "$OFFERS" --remote --file .data/offers.parquet
          bunx wrangler@4 r2 object put "freelance-offers/backups/$(date -u +%Y-%m).parquet" --remote --file .data/offers.parquet

      - name: Deploy site
        run: bunx wrangler@4 deploy

      - name: Commit statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data.json
          git commit -m "chore(data): update stats for $(date -u +%F)"
          git push

      # GitHub disables scheduled workflows after 60 days without repository activity.
      - name: Keep the schedule enabled
        if: github.ref == 'refs/heads/main'
        run: gh workflow enable daily-stats.yml
        env:
          GH_TOKEN: ${{ github.token }}
