name: daily-stats

on:
  schedule:
    # Off the hour: GitHub warns that the start of each hour is the busiest.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write # commit data.json
  actions: write # keep this workflow enabled

concurrency:
  group: daily-stats

env:
  OFFERS: freelance-offers/offers.parquet
  WRANGLER: bunx wrangler@4.156.0

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Shows the real deploy state and address on the repository page.
    environment:
      name: Production
      url: https://freelance.shellbear.me
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run verify

      # The Cloudflare token is only given to the steps that call Wrangler.
      - name: Download private offers
        run: |
          mkdir -p .data
          $WRANGLER r2 object get "$OFFERS" --remote --file .data/offers.parquet
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Fails on any missing page, so nothing is published. The next run re-reads 7 days.
      - name: Fetch new offers
        run: bun run fetch

      - name: Build
        run: bun run build

      - name: Upload private offers
        run: |
          $WRANGLER r2 object put "$OFFERS" --remote --file .data/offers.parquet
          $WRANGLER r2 object put "freelance-offers/backups/$(date -u +%Y-%m).parquet" --remote --file .data/offers.parquet
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy site
        run: $WRANGLER deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Commit statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data.json
          git commit -m "chore(data): update stats for $(date -u +%F)"
          git push

      # GitHub disables scheduled workflows after 60 days without repository activity.
      - name: Keep the schedule enabled
        if: github.ref == 'refs/heads/main'
        run: gh workflow enable daily-stats.yml
        env:
          GH_TOKEN: ${{ github.token }}
